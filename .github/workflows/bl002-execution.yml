name: BL002 execution

on:
  pull_request:
    branches:
      - bl-002/specification-001
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80b77f1ba98a669f191742738cc95186d3971441
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen audit environment
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Verify frozen BL002 blob
        shell: python
        run: |
          import hashlib, pathlib
          p = pathlib.Path('experiments/bl002.py')
          data = p.read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          print('git_blob_sha', sha)
          assert sha == '48f6321e3f238f402e144c6284c8d94512fabd91'
      - name: Pre-run audit
        run: python experiments/bl002.py | tee bl002_audit.json
      - name: Execute frozen BL002
        run: python experiments/bl002.py --execute | tee bl002_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: bl002-result
          path: |
            bl002_audit.json
            bl002_result.json
